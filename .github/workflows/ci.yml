name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["mobile/**", "docs/**", "*.md"]
  pull_request:
    paths-ignore: ["mobile/**", "docs/**", "*.md"]

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          xcodebuild -scheme Nichi -destination 'platform=macOS' \
            build test CODE_SIGNING_ALLOWED=NO
