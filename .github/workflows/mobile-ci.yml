name: Mobile CI

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx expo lint
      - name: Unit tests
        run: npm test
      - name: Expo Doctor
        run: npx expo-doctor
        continue-on-error: true # SDK 58 is still in beta; surface warnings without blocking
      - name: Prebuild sanity (config plugins and the local Android module)
        run: npx expo prebuild --platform all --no-install --clean
